# ══════════════════════════════════════
# 基础环境
# ══════════════════════════════════════
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"
set -s escape-time 0
set -s extended-keys on
set -sg repeat-time 300
set -s focus-events on
set -g mouse on
set -g history-limit 10000
set -g detach-on-destroy off
set -g status-interval 5
set-hook -g client-session-changed 'refresh-client -S'
if-shell 'test "$(uname -s)" = Darwin && test -x /opt/homebrew/bin/sketchybar' \
    'set-hook -ag client-session-changed "run-shell -b \"/opt/homebrew/bin/sketchybar --trigger tmux_project_changed\""'

# ══════════════════════════════════════
# 编号
# ══════════════════════════════════════
set -g base-index 1
set -w -g pane-base-index 1
set -w -g automatic-rename on
set -g renumber-windows on
# set -g pane-border-status top
# set -g pane-border-format " #{pane_index}: #{pane_current_command} · #{pane_current_path} "

unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# ══════════════════════════════════════
# 基础操作
# ══════════════════════════════════════
bind b last-window

bind r \
    source-file ~/.config/tmux/tmux.conf \; \
    display-message "~/.config/tmux/tmux.conf reloaded"
bind . command-prompt -p "Project name:" "rename-session '%%'"

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind f display-popup -E "~/.config/scripts/tmux/sessionizer.sh"
bind S display-popup -E -w 50% -h 60% "~/.config/scripts/tmux/ssh_sessionizer.sh"
bind t display-popup -E -w 80% -h 80% -d "#{session_path}" "nvim TODO.md"

# ══════════════════════════════════════
# Things 采集（仅 macOS；Linux 上保留按键给其他用途）
# ══════════════════════════════════════
# 按 session 名投递到同名 Things 项目，项目不存在则自动创建（放进 Personal area）。
# 输入用 nvim：首行=标题，其余行=notes，--- 分隔多条；:w 提交，:q 取消。
# 投递在 nvim 退出后 fork 到后台，popup 立刻关闭，不阻塞。
if-shell 'test "$(uname -s)" = Darwin' \
    'bind a display-popup -E -w 70% -h 40% "~/.config/scripts/things/things_capture.sh --edit"'
if-shell 'test "$(uname -s)" = Darwin' \
    'bind A display-popup -E -w 70% -h 40% "~/.config/scripts/things/things_capture.sh --edit --quick-entry"'

# ══════════════════════════════════════
# 导出 Pane 到 HTML
# ══════════════════════════════════════

# prefix + E: 导出当前 pane 完整内容到 HTML，路径复制到剪贴板
bind E run-shell -b '~/.config/scripts/tmux/export_pane_html.sh "#{pane_id}"'

# ══════════════════════════════════════
# Copy Mode（vi 风格）
# ══════════════════════════════════════
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode MouseDown1Pane send-keys -X cancel

# ══════════════════════════════════════
# 外观
# ══════════════════════════════════════

# 调色板（Kanagawa 风格）
# bg:      #1F1F28
# sumiInk: #2A2A37
# fujiGray:#727169
# oldWhite:#C8C093
# sakura:  #D27E99
# wave:    #7E9CD8

set -g status-position bottom
set -g status-style "bg=#1F1F28"
set -g status-justify centre

# ── 左侧：当前机器 + 该机器的 project 导航 ──
set -g status-left-length 100
set -g status-left "#(~/.config/scripts/tmux/status/left.sh '#{session_id}')   "

# project 是 session，window/pane 仍使用 tmux 默认的点击切换。
bind -n MouseDown1Status if-shell -F '#{==:#{mouse_status_range},session}' \
    'switch-client -t =' \
    'select-window -t ='

# ── 右侧：留空 ──
set -g status-right-length 0
set -g status-right ""

# ── Window 列表 ──
setw -g window-status-format "#[fg=#727169]  #W "
setw -g window-status-current-format "#[fg=#D27E99,bold]  #W "
setw -g window-status-separator "|"

# ── Pane 边框 ──
set -g pane-active-border-style "fg=#D28E99"
set -g pane-border-style "fg=#2A2A37"
set -g pane-border-lines heavy
set -g pane-border-indicators arrows
set -g window-style "bg=default"
set -g window-active-style "bg=default"

# ── 消息 & 命令行 ──
set -g message-style "fg=#C8C093,bg=#2A2A37"
set -g message-command-style "fg=#D27E99,bg=#2A2A37"

# ── 选择模式 ──
set -g mode-style "fg=#1F1F28,bg=#D27E99"

# ══════════════════════════════════════
# 插件
# ══════════════════════════════════════
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '0'
# set -g @continuum-restore 'on'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'
set -g @sessionx-window-mode 'on'
set -g @sessionx-filter-current 'false'

# TPM 初始化（必须放最后一行）
run '~/.tmux/plugins/tpm/tpm'
